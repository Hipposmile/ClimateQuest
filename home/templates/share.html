{% extends "base.html" %}

{% block title %}Share{% endblock %}

{% block content %}

<style>
    .share-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
}

.message-box {
    margin-bottom: 20px;
}

.message {
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
}

.divider {
    margin: 20px 0;
    font-weight: bold;
    color: var(--color-text);
}

.share-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.share-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: var(--color-text-light);
}

.share-btn:hover {
    transform: scale(1.05);
}

.native-share {
    background-color: #444; /*Nicht-Variable genehmigt*/
}

.facebook {
    background-color: #0866ff; /*Nicht-Variable genehmigt*/
}

.x {
    background-color: #000000; /*Nicht-Variable genehmigt*/
}

.linkedin {
    background-color: #0a66c2; /*Nicht-Variable genehmigt*/
}

.whatsapp {
    background-color: #25d366; /*Nicht-Variable genehmigt*/
}

.email {
    background-color: #7f7f7f; /*Nicht-Variable genehmigt*/
}

.copy {
    background-color: #6c757d; /*Nicht-Variable genehmigt*/
}
</style>

<div class="share-container">
    <h1>Seite teilen</h1>

    {% if messages %}
    <div class="message-box">
        {% for message in messages %}
        <p class="message {{ message.level_tag }}">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <h3>Folgende URL teilen: <a href="{{ url }}">{{ url }}</a></h3>

    <button class="share-btn native-share" onclick="sharePage('{{ url }}')">Teilen über Gerät</button>

    <p class="divider">ODER</p>

    <div class="share-panel">
        <a href="https://www.facebook.com/sharer/sharer.php?u={{ url }}" target="_blank" title="Facebook">
            <button class="share-btn facebook">Facebook</button>
        </a>
        <a href="https://twitter.com/intent/tweet?url={{ url }}" target="_blank" title="X (Twitter)">
            <button class="share-btn x">X (Twitter)</button>
        </a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ url }}" target="_blank" title="LinkedIn">
            <button class="share-btn linkedin">LinkedIn</button>
        </a>
        <a href="https://api.whatsapp.com/send?text={{ url }}" target="_blank" title="WhatsApp">
            <button class="share-btn whatsapp">WhatsApp</button>
        </a>
        <a href="mailto:?subject=Schau mal!&body={{ url }}" title="E-Mail">
            <button class="share-btn email">E-Mail</button>
        </a>
        <button class="share-btn copy" onclick="copyURL('{{ url }}')" title="Link kopieren" id="copy_button">Link
            kopieren</button>
    </div>
</div>

<script>
    function sharePage(url) {
        if (navigator.share) {
            navigator.share({ url: url }).catch(console.error);
        } else {
            alert("Teilen wird auf diesem Gerät nicht unterstützt.");
        }
    }

    function copyURL(url) {
        const copy_button = document.getElementById('copy_button');

        navigator.clipboard.writeText(url)
            .then(() => {
                copy_button.textContent = "Link kopiert";
                setTimeout(() => {
                    copy_button.textContent = "Link kopieren";
                }, 1000);
            })
            .catch(() => {
                copy_button.textContent = "Kopieren fehlgeschlagen";
                setTimeout(() => {
                    copy_button.textContent = "Link kopieren";
                }, 1000);
            });
    }
</script>
{% endblock %}
