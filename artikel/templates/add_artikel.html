{% extends "base.html" %}

{% block title %}Artikel hinzufügen{% endblock %}

{% block content %}

<h1>Artikel hinzufügen</h1>

{% if messages %}
{% for message in messages %}
<p class="{{message.level_tag}}-message">{{ message }}</p>
{% endfor %}
{% endif %}

<form method="post" onsubmit="fillEditor(event)">
    {% csrf_token %}
    <label for="name">Name</label>
    <input type="text" name="name" id="name" placeholder="Name">

    <label for="content_editor">Beschreibung</label>
    <div id="content_editor" class="quill-editor"></div>
    <input type="hidden" name="content">

    <button type="submit">Speichern</button>
</form>

<!-- Quill CSS -->
<div class="cookie-blocked" data-requires="quill"
    data-content='<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />'>
</div>

<script>
    let quill;
    document.addEventListener('DOMContentLoaded', function () {
        let editor = document.getElementById('content_editor')
        if (getCookiePreferences().quill) {
            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js";
            document.body.appendChild(script);
            script.onload = function () {
                if (editor) {
                    quill = new Quill(editor, {
                        theme: 'snow',
                        modules: {
                            toolbar: [
                                [{ header: [1, 2, false] }],
                                ['bold', 'italic', 'underline'],
                                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                                ['link']
                            ]
                        }
                    });
                } else 
                {
                    console.warn("Editor not found");
                }
            }
        } else {
            editor.innerHTML = `<textarea placeholder="Beschreibung" class="quill-editor" style="max-width: 400px; min-width: 400px;"></textarea>`;
        }
    });


    // Beim Absenden des Formulars
    function fillEditor(event) {
        if (getCookiePreferences().quill) {
            const form = event.target;
            event.preventDefault();
            try {
                var html = quill.root.innerHTML;
                console.log(html)
                form.querySelector('input[name=content]').value = html;
                form.submit();
            } catch {
                console.error("Variable Quill not found");
                alert("Ein interner Fehler ist aufgetreten. Probieren Sie es später bitte erneut!");
                return false;
            }
        }
    }
</script>
{% endblock %}
