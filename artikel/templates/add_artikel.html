{% extends "base.html" %}
{% block meta %}
    <meta name="description"
          content="Füge einen neuen Artikel bei ClimateQuest hinzu, um andere User über Klimaschutz zu informieren oder Tipps zu geben.">
{% endblock %}
{% block title %}Artikel hinzufügen{% endblock %}

{% block content %}

    <h1>Artikel hinzufügen</h1>

    {% if messages %}
        {% for message in messages %}
            <p class="{{ message.level_tag }}-message">{{ message|safe }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="fill-editor">
        {% csrf_token %}
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Name" maxlength="100" required>

        <label for="content_editor">Inhalt</label>
        <div id="content_editor" class="quill-editor"></div>
        <input type="hidden" name="content">

        <label for="category">Kategorie</label>
        <select id="category" name="category">
            {% for category in categories %}
                <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
        </select>

        <label class="custom-checkbox">
            <input type="checkbox" name="is_truth">
            <span class="checkmark"></span>
            <span class="label-text">Ich bestätige, dass alle Angaben der Wahrheit entsprechen, mit mindestens zwei Quellen, welche im Text vorkommen, übereinstimmen und dass der Artikel mit den <a
                    href="{% url 'nutzungsbedingungen' %}">Nutzungsbedingungen</a> übereinstimmt. </span>
        </label>

        <button type="submit">Speichern</button>
    </form>

    <script nonce="{{ request.csp_script_nonce }}">
        document.addEventListener('DOMContentLoaded', initializeQuill);
    </script>
{% endblock %}
