<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Produktionsmodus</title>
    <meta name="color-scheme" content="light dark"/>
    <link rel="icon" href="https://climate-quest.de/static/icons/favicon.ico"/>
    <style nonce="{{ request.csp_style_nonce }}">
        :root {
            --bg: #0f172a;
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --primary: #22d3ee;
            --primary-ink: #0e7490;
            --focus: #a78bfa;
            --radius: 16px;
            --shadow: 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 1px rgba(255, 255, 255, 0.05);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f7fb;
                --card: rgba(255, 255, 255, 0.7);
                --border: rgba(0, 0, 0, 0.06);
                --text: #0f172a;
                --muted: #475569;
                --primary: #0ea5e9;
                --primary-ink: #0369a1;
                --focus: #7c3aed;
                --shadow: 0 20px 40px rgba(0, 0, 0, 0.12), inset 0 1px rgba(255, 255, 255, 0.6);
            }
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial;
            background: radial-gradient(1000px 600px at 10% 10%, rgba(34, 211, 238, 0.15), transparent 45%),
                        radial-gradient(1000px 600px at 90% 90%, rgba(167, 139, 250, 0.18), transparent 45%),
                        var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            backdrop-filter: blur(16px) saturate(140%);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(22px, 3.2vw, 28px);
            line-height: 1.2;
            margin: 0;
            letter-spacing: -0.01em;
        }

        p {
            font-size: clamp(15px, 2.4vw, 16px);
            color: var(--muted);
            margin: 8px 0 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--primary), var(--primary-ink));
            color: white;
            box-shadow: 0 10px 22px rgba(34, 211, 238, 0.35);
        }

        .btn-primary:hover { transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px dashed var(--border);
        }

        footer {
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:focus-visible, .btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
            border-radius: 14px;
        }
    </style>
</head>
<body>
<main class="card" role="main" aria-labelledby="error-title">
    <div class="header">
        <div>
            <h1 id="error-title">Produktionsmodus</h1>
            <p>Die angeforderte Seite kann nur im Produktionsmodus angezeigt werden. Vielleicht hilft dir einer der folgenden Schritte.</p>
        </div>
    </div>

    <div class="actions">
        <button id="home" class="btn btn-primary" type="button">Zur Startseite</button>
        <button id="back" class="btn btn-secondary" type="button">Zurück</button>
    </div>

    <footer>
        <span>Diese Seite wird angezeigt, wenn die eigentliche Seite nur im Produktionsmodus aufgerufen werden kann.</span>
    </footer>
</main>

<script nonce="{{ request.csp_script_nonce }}">
    document.getElementById('home').addEventListener('click', () => {
        location.href = '/';
    });

    document.getElementById('back').addEventListener('click', () => {
        history.back();
    });
</script>
</body>
</html>
