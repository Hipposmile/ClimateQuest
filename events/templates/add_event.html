{% extends "base.html" %}
{% block meta %}
    <meta name="description"
          content="Füge ein neues Event bei ClimateQuest hinzu, um mehr Leute für große Events wie Demos zu gewinnen.">
{% endblock %}
{% block title %}Event hinzufügen{% endblock %}

{% block content %}
    <h1>Event hinzufügen</h1>
    {% if messages %}
        {% for message in messages %}
            <p class="{{ message.level_tag }}-message">{{ message|safe }}</p>
        {% endfor %}
    {% endif %}
    <form method="post" class="fill-editor">
        {% csrf_token %}
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Name" maxlength="100" required>

        <label for="content_editor">Beschreibung</label>
        <div id="content_editor" class="quill-editor"></div>
        <input type="hidden" name="content">

        <label for="date_time">Datum und Uhrzeit (Beginn)</label>
        <input type="datetime-local" id="date_time" name="date_time" required>

        <label for="duration">geschätze Dauer in Minuten</label>
        <input type="number" min="0" id="duration" name="duration" placeholder="Dauer" required>

        <label for="adress">Adresse</label>
        <input type="text" id="adress" name="adress" placeholder="Adresse" maxlength="100" required>

        <label class="custom-checkbox">
            <input type="checkbox" name="is_truth">
            <span class="checkmark"></span>
            <span class="label-text">Ich bestätige, dass alle Angaben der Wahrheit entsprechen und mit den <a
                    href="{% url 'nutzungsbedingungen' %}">Nutzungsbedingungen</a> übereinstimmen. Außerdem verpflichte ich mich, bei dem Event selbst teilzunehmen.</span>
        </label>

        <button type="submit">Hinzufügen</button>
    </form>

    <!-- Quill CSS -->
    <div class="cookie-blocked" data-requires="quill"
         data-content='<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />'>
    </div>

    <script nonce="{{ request.csp_script_nonce }}">
        document.addEventListener('DOMContentLoaded', function () {
            const day_after_tomorrow = new Date(Date.now() + 48 * 60 * 60 * 1000);
            const formatted = day_after_tomorrow.toISOString().slice(0, 16); // YYYY-MM-DDTHH:MM
            let dateInput = document.getElementById('date_time');
            dateInput.min = formatted;
            dateInput.value = formatted;

            initializeQuill();
        });
    </script>
{% endblock %}
