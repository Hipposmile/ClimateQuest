<!DOCTYPE html>
{% load static %}
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Meine Seite{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <script src="{% static 'js/cookie-consent.js' %}" defer></script>

    <style>
        #up-btn {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background-color: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--color-shadow-light);
            display: none;
            z-index: 1000;
            transition: background 0.2s;
        }

        #up-btn:hover {
            background-color: var(--color-primary-hover);
        }

        .benachrichtigung-wrapper {
            position: relative;
            display: inline-block;
            font-size: 20px;
        }

        .count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--color-notification);
            color: var(--color-white);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        #darkmode-switch .switch {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 40px;
        }

        #darkmode-switch .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        #darkmode-switch .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #f1c40f;
            border-radius: 40px;
            transition: background-color 0.4s;
        }

        #darkmode-switch .slider::before {
            content: "☀️";
            position: absolute;
            width: 32px;
            height: 32px;
            left: 4px;
            top: 4px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.4s, content 0.4s, background-color 0.4s;
        }

        #darkmode-switch input:checked + .slider {
            background-color: #06080a;
        }

        #darkmode-switch input:checked + .slider::before {
            content: "🌙";
            transform: translateX(40px);
            background-color: #444;
        }
    </style>
</head>

<body>

</header>

    <p>&copy; 2025 Verbrauch Dokumentation</p>
</footer>

<button id="up-btn" title="Nach oben">↑</button>

<!-- DarkMode -->
<script>
    // 🎨 Farbdefinitionen
    const darkmodeColors = {
        '--color-bg': '#222831',
        '--color-bg-light': '#393e46',
        '--color-bg-dark': '#23272f',
        '--color-text': '#f4f6f8',
        '--color-text-light': '#eeeeee',
        '--color-primary': '#00adb5',
        '--color-primary-hover': '#00939c',
        '--color-primary-light': '#393e46',
        '--color-accent': '#ff00a2',
        '--color-white': '#222831',
        '--color-header-bg': '#23272f',
        '--color-header-text': '#eeeeee',
        '--color-muted': '#888',
        '--color-error': '#e74c3c',
        '--color-success': '#2ecc71',
        '--color-shadow-light': 'rgba(0,0,0,0.18)',
        '--color-shadow-hover': 'rgba(0,0,0,0.28)',
        '--color-green-dark': '#176d3b',
        '--color-blue-dark': '#00adb5',
        '--color-border': '#444',
        '--color-border-green': '#393e46',
        '--color-notification': '#ff5722'
    };

    const lightmodeColors = {
        '--color-bg': '#f4f6f8',
        '--color-bg-light': '#f7fafd',
        '--color-bg-dark': '#e0f7e9',
        '--color-text': '#333',
        '--color-text-light': '#ecf0f1',
        '--color-primary': '#3498db',
        '--color-primary-hover': '#2980b9',
        '--color-primary-light': '#e3f0fa',
        '--color-accent': '#ff00a2',
        '--color-white': '#ffffff',
        '--color-header-bg': '#2c3e50',
        '--color-header-text': '#ecf0f1',
        '--color-muted': '#888',
        '--color-error': '#e74c3c',
        '--color-success': '#2ecc71',
        '--color-shadow-light': 'rgba(0, 0, 0, 0.06)',
        '--color-shadow-hover': 'rgba(0, 0, 0, 0.1)',
        '--radius-lg': '12px',
        '--shadow-md': '0 2px 10px rgba(0, 0, 0, 0.06)',
        '--color-green-dark': '#176d3b',
        '--color-blue-dark': '#34495e',
        '--color-border': '#ccc',
        '--color-border-green': '#b2dfdb',
        '--color-notification': 'red',
        '--color-counters': '#3a6b4f',
        '--color-counters-bg': '#f5f9f6'
    };


    // 🎛️ Farben anwenden
    function setColors(colors) {
        const root = document.documentElement;
        Object.entries(colors).forEach(([key, value]) => {
            root.style.setProperty(key, value);
        });
    }

    // 🌙 Initialisierung beim Laden
    window.addEventListener('DOMContentLoaded', () => {
        const checkbox = document.getElementById('darkmode-switch-checkbox');
        const darkmodeEnabled = localStorage.getItem('darkmodeEnabled') === 'true';

        if (checkbox) {
            checkbox.checked = darkmodeEnabled;
            setColors(darkmodeEnabled ? darkmodeColors : lightmodeColors);

            checkbox.addEventListener('change', () => {
                const isDark = checkbox.checked;
                setColors(isDark ? darkmodeColors : lightmodeColors);
                localStorage.setItem('darkmodeEnabled', isDark.toString());
            });
        } else {
            console.warn('⚠️ Darkmode-Switch-Checkbox nicht gefunden!');
        }
    });
</script>


<!--Up-Button-->
<script>
    // Button ein-/ausblenden beim Scrollen
    const upBtn = document.getElementById('up-btn');
    window.addEventListener('scroll', function () {
        if (window.scrollY > 10) {
            upBtn.style.display = 'block';
        } else {
            upBtn.style.display = 'none';
        }
    });
    // Smooth scroll nach oben
    upBtn.addEventListener('click', function () {
        window.scrollTo({top: 0});
    });
</script>

<!--Translate-->
<script>
    const translate_btn = document.getElementById('translate_btn');

    // Zustand aus localStorage prüfen
    if (localStorage.getItem('translateEnabled') === 'true') {
        const script = document.createElement('script');
        script.src = "{% static 'js/googleTranslate.js' %}";
        script.onload = () => {
            if (typeof initGoogleTranslate === 'function') {
                try {
                    initGoogleTranslate();
                } catch (e) {
                    alert("We're sorry, but this function is not available at the moment. Please use your browser's translation tools or try again later.");
                }
                translate_btn.textContent = 'End translation';
            }
        };
        document.head.appendChild(script);
    }

    translate_btn.addEventListener('click', function () {
        const isEnabled = localStorage.getItem('translateEnabled') === 'true';

        const script = document.createElement('script');
        script.src = "{% static 'js/googleTranslate.js' %}";
        script.onload = () => {
            if (isEnabled) {
                if (typeof removeGoogleTranslate === 'function') {
                    removeGoogleTranslate();
                    translate_btn.textContent = 'Translate';
                }
            } else {
                if (typeof initGoogleTranslate === 'function') {
                    try {
                        initGoogleTranslate();
                    } catch (e) {
                        alert("We're sorry, but this function is not available at the moment. Please use your browser's translation tools or try again later.");
                    }
                    translate_btn.textContent = 'End translation';
                }
            }
        };
        document.head.appendChild(script);
    });
</script>

{% if user.is_authenticated %}
    <script>
        function ladeBenachrichtigungenAnzahl() {
            fetch('/count-benachrichtigungen/')
                .then(response => {
                    if (!response.ok) throw new Error("Netzwerkfehler: " + response.status);
                    return response.json();
                })
                .then(data => {
                    const countSpan = document.getElementById('benachrichtigungen-count');
                    let benachrichtigungen_count = data.benachrichtigungen_count
                    if (benachrichtigungen_count != 0) {
                        if (countSpan) {
                            countSpan.textContent = data.benachrichtigungen_count;
                        } else {
                            console.warn("Element #benachrichtigungen-count nicht gefunden.");
                        }
                    } else {
                        countSpan.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Fehler beim Laden der Benachrichtigungen:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', ladeBenachrichtigungenAnzahl);
    </script>
{% endif %}
