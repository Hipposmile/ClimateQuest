<!DOCTYPE html>
{% load static %}
<html lang="de">

<head>
    {% block meta %}{% endblock %}

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="ClimateQuest">
    <meta property="og:description" content="Willkommen bei ClimateQuest. Motiviere dich selbst für mehr Klimaschutz, indem du Klimapunkte sammelst und dich mit anderen Usern vergleichst. Teile dein Wissen in Artikeln oder im Forum und leiste deinen Beitrag zum Klimaschutz.">
    <meta property="og:image" content="https://climate-quest.de/static/images/SocialMediaPreview.jpg">
    <meta property="og:url" content="{{ request.build_absolute_uri}}">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ClimateQuest">
    <meta name="twitter:description" content="Willkommen bei ClimateQuest. Motiviere dich selbst für mehr Klimaschutz, indem du Klimapunkte sammelst und dich mit anderen Usern vergleichst. Teile dein Wissen in Artikeln oder im Forum und leiste deinen Beitrag zum Klimaschutz.">
    <meta name="twitter:image" content="https://climate-quest.de/static/images/SocialMediaPreview.jpg">

    <meta name="description" content="Willkommen bei ClimateQuest. Motiviere dich selbst für mehr Klimaschutz, indem du Klimapunkte sammelst und dich mit anderen Usern vergleichst. Teile dein Wissen in Artikeln oder im Forum und leiste deinen Beitrag zum Klimaschutz.">
    <meta name="robots" content="index, follow">
    
    <title>{% block title %}ClimateQuest{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <script src="{% static 'js/cookie-consent.js' %}" defer></script>

    <style>
        #up-btn {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background-color: var(--color-primary);
            border: none;
            border-radius: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--color-shadow-light);
            display: none;
            z-index: 1000;
            transition: background 0.2s;
        }

        #up-btn:hover {
            background-color: var(--color-primary-hover);
        }

        .benachrichtigung-wrapper {
            position: relative;
            display: inline-block;
            font-size: 20px;
        }

        .count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--color-notification);
            color: var(--color-white);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div id="google_translate_element"></div>
<header id="header">
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p><a href="{% url 'aktionenTable' %}">Alle Aktionen</a></p>
    <p><a href="{% url 'nutzungsbedingungen' %}">Nutzungsbedingungen</a></p>
    <p><a href="{% static 'rechtliches/Impressum.pdf' %}" download>Impressum</a></p>
    <p><a href="{% static 'rechtliches/Datenschutz.pdf' %}" download>Datenschutz</a></p>
</footer>

<nav aria-label="Nach oben">
  <button id="up-btn" class="emoji">&#x2B06;</button>
</nav>
<!--Nav-Leist-->
<script>
    const header = document.getElementById('header');

    const renderMobileNav = () => {
        header.innerHTML = `<button id="openSidebar">☰ Menü öffnen</button>
            <div id="sidebar">
                <button id="closeSidebar">×</button>
                <nav>
                    <a href="/" class="logo-link">
                        <img src="{% static 'images/ClimateQuest.png' %}" alt="climateQuest Logo" class="logo-img">
                    </a>
                    <hr>
                    <li><a href="{% url 'share' %}?url={{ request.build_absolute_uri|urlencode }}" class="share">Teilen</a></li>
                    <hr>
                    {% if user.is_authenticated %}
                    <details>
                        <summary>Konto</summary>
                        <ul>
                            <li><p>{{ user.username }}</p></li>
                            <li><a href="{% url 'level_view' request.user.id %}">Level</a></li>
                            <li><a href="{% url 'klimapunkte_view' request.user.id %}">Klimapunkte</a></li>
                            <li><a href="{% url 'settings_view' %}">Profil bearbeiten</a></li>
                            <li><a href="{% url 'presents_overview' %}">Geschenke</a></li>
                            <li><a href="{% url 'logout_view' %}">Logout</a></li>
                            {% if user.is_staff %}
                            <li><a href="/ClimateQuestAdmin/" target="_blank">Admin-Bereich (I)</a></li>
                            <li><a href="{% url 'admin_view' %}">Admin-Bereich (II)</a></li>
                            {% endif %}
                        </ul>
                    </details>
                    <hr>
                    <details>
                        <summary>Verbrauch</summary>
                        <ul>
                            <li><a href="{% url 'add' %}">Aktion hinzufügen</a></li>
                            <li><a href="{% url 'history' %}">Verbrauchshistorie</a></li>
                        </ul>
                    </details>
                    <hr>
                    <details>
                        <summary>Family</summary>
                        <ul>
                            <li><a href="{% url 'create_family' %}">Family erstellen</a></li>
                            <li><a href="{% url 'join_family' %}">Family beitreten</a></li>
                            <li><a href="{% url 'families_view' %}">Meine Families</a></li>
                        </ul>
                    </details>
                    <hr>
                    <details>
                        <summary>Community</summary>
                        <ul>
                            <li><a href="{% url 'create_community' %}">Community erstellen</a></li>
                            <li><a href="{% url 'join_community' %}">Community beitreten</a></li>
                            <li><a href="{% url 'communities_view' %}">Meine Communities</a></li>
                        </ul>
                    </details>
                    <hr>
                    <a href="{% url 'benachrichtigungen_view' %}">
                        <div class="benachrichtigung-wrapper">
                            <span class="icon">Benachrichtigungen</span>
                            <span id="benachrichtigungen-count" class="count">0</span>
                        </div>
                    </a>
                    <hr>
                    {% else %}
                    <details>
                        <summary>Login</summary>
                        <ul>
                            <li><a href="{% url 'login_view' %}">Login</a></li>
                            <li><a href="{% url 'login_view' %}">Registrieren</a></li>
                        </ul>
                    </details>
                    <hr>
                    {% endif %}
                    <details>
                        <summary>Events</summary>
                        <ul>
                            <li>{% if user.is_authenticated %}<a href="{% url 'add_event' %}">Event hinzufügen</a>{% endif %}</li>
                            <li><a href="{% url 'events_overview' %}">Überblick</a></li>
                        </ul>
                    </details>
                    <hr>
                    <details>
                        <summary>Artikel</summary>
                        <ul>
                            <li>{% if user.is_authenticated %}<a href="{% url 'add_artikel' %}">Artikel hinzufügen</a>{% endif %}</li>
                            <li><a href="{% url 'artikel_overview' %}">Überblick</a></li>
                        </ul>
                    </details>
                    <hr>
                    <details>
                        <summary>Forum</summary>
                        <ul>
                            <li>{% if user.is_authenticated %}<a href="{% url 'add_forum_post' %}">Post hinzufügen</a>{% endif %}</li>
                            <li><a href="{% url 'forum_overview' %}">Überblick</a></li>
                        </ul>
                    </details>
                    <hr>
                    <p>Öffne diese Seite für ein übersichtlicheres Design bitte auf einem größeren Bildschirm (Tablet, Laptop, o.Ä.)</p>
                </nav>
            </div>`;

        const sidebar = document.getElementById('sidebar');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        openBtn.addEventListener('click', () => sidebar.classList.add('active'));
        closeBtn.addEventListener('click', () => sidebar.classList.remove('active'));
    };

    const renderDesktopNav = () => {
        header.innerHTML = `<a href="/" class="logo-link">
                <img src="{% static 'images/ClimateQuest.png' %}" alt="climateQuest Logo" class="logo-img">
            </a>
            <nav>
                <a href="{% url 'share' %}?url={{ request.build_absolute_uri|urlencode }}" class="share">Teilen</a>

                {% if user.is_authenticated %}
                <div class="dropdown">
                    <span class="nav-link inactive-link">Konto ▾</span>
                    <div class="dropdown-content">
                        <p>{{ user.username }}</p>
                        <a href="{% url 'level_view' request.user.id %}">Level</a>
                        <a href="{% url 'klimapunkte_view' request.user.id %}">Klimapunkte</a>
                        <a href="{% url 'settings_view' %}">Profil bearbeiten</a>
                        <a href="{% url 'presents_overview' %}">Geschenke</a>
                        <a href="{% url 'logout_view' %}">Logout</a>
                        {% if user.is_staff %}
                        <a href="/ClimateQuestAdmin/" target="_blank">Admin-Bereich (I)</a>
                        <a href="{% url 'admin_view' %}">Admin-Bereich (II)</a>
                        {% endif %}
                    </div>
                </div>
                <div class="dropdown">
                    <span class="nav-link inactive-link">Verbrauch ▾</span>
                    <div class="dropdown-content">
                        <a href="{% url 'add' %}">Aktion hinzufügen</a>
                        <a href="{% url 'history' %}">Verbrauchshistorie</a>
                    </div>
                </div>
                <div class="dropdown">
                    <span class="nav-link inactive-link">Family ▾</span>
                    <div class="dropdown-content">
                        <a href="{% url 'create_family' %}">Family erstellen</a>
                        <a href="{% url 'join_family' %}">Family beitreten</a>
                        <a href="{% url 'families_view' %}">Meine Families</a>
                    </div>
                </div>
                <div class="dropdown">
                    <span class="nav-link inactive-link">Community ▾</span>
                    <div class="dropdown-content">
                        <a href="{% url 'create_community' %}">Community erstellen</a>
                        <a href="{% url 'join_community' %}">Community beitreten</a>
                        <a href="{% url 'communities_view' %}">Meine Communities</a>
                    </div>
                </div>
                <a href="{% url 'benachrichtigungen_view' %}">
                    <div class="benachrichtigung-wrapper">
                        <span class="icon emoji">&#x1F514;</span>
                        <span id="benachrichtigungen-count" class="count">0</span>
                    </div>
                </a>
                {% else %}
                <a href="{% url 'login_view' %}">Login</a>
                {% endif %}
                <div class="dropdown">
                    <span class="nav-link inactive-link">Events ▾</span>
                    <div class="dropdown-content">
                        {% if user.is_authenticated %}<a href="{% url 'add_event' %}">Event hinzufügen</a>{% endif %}
                        <a href="{% url 'events_overview' %}">Überblick</a>
                    </div>
                </div>
                <div class="dropdown">
                    <span class="nav-link inactive-link">Artikel ▾</span>
                    <div class="dropdown-content">
                        {% if user.is_authenticated %}<a href="{% url 'add_artikel' %}
            ">Artikel hinzufügen</a>{% endif %}
                        <a href="{% url 'artikel_overview' %}">Überblick</a>
                    </div>
                </div>
                <div class="dropdown">
                    <span class="nav-link inactive-link">Forum ▾</span>
                    <div class="dropdown-content">
                        {% if user.is_authenticated %}<a href="{% url 'add_forum_post' %}
            ">Beitrag hinzufügen</a>{% endif %}
                        <a href="{% url 'forum_overview' %}">Überblick</a>
                    </div>
                </div>
            </nav>`;

        const dropdown = document.querySelector('.dropdown');
        const toggle = dropdown.querySelector('.nav-link');
        const content = dropdown.querySelector('.dropdown-content');

        // Öffnen/Schließen bei Klick auf Button
        toggle.addEventListener('click', (e) => {
            e.stopPropagation(); // Verhindert, dass das Dokument den Klick sieht
            content.classList.toggle('visible');
        });

        // Schließen bei Klick irgendwo anders
        document.addEventListener('click', () => {
            content.classList.remove('visible');
        });

        // Optional: Klick im Menü soll nicht schließen
        content.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    };

    function handleResize() {
        if (window.innerWidth < 1200) {
            renderMobileNav();
        } else {
            renderDesktopNav();
        }
    }
    
    window.addEventListener('resize', handleResize);
    window.addEventListener('load', handleResize);
</script>


<!--Up-Button-->
<script>
    // Button ein-/ausblenden beim Scrollen
    const upBtn = document.getElementById('up-btn');
    window.addEventListener('scroll', function () {
        if (window.scrollY > 10) {
            upBtn.style.display = 'block';
        } else {
            upBtn.style.display = 'none';
        }
    });
    // Smooth scroll nach oben
    upBtn.addEventListener('click', function () {
        window.scrollTo({top: 0});
    });
</script>

{% if user.is_authenticated %}
    <script>
        function ladeBenachrichtigungenAnzahl() {
            fetch('/count-benachrichtigungen/')
                .then(response => {
                    if (!response.ok) throw new Error("Netzwerkfehler: " + response.status);
                    return response.json();
                })
                .then(data => {
                    const countSpan = document.getElementById('benachrichtigungen-count');
                    let benachrichtigungen_count = data.benachrichtigungen_count
                    if (benachrichtigungen_count != 0) {
                        if (countSpan) {
                            countSpan.textContent = data.benachrichtigungen_count;
                        } else {
                            console.warn("Element #benachrichtigungen-count nicht gefunden.");
                        }
                    } else {
                        countSpan.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Fehler beim Laden der Benachrichtigungen:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', ladeBenachrichtigungenAnzahl);
    </script>
{% endif %}
</body>

</html>
