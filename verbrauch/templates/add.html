{% extends 'base.html' %}

{% block title %}
    Aktion hinzufügen
{% endblock %}

{% block content %}
    <h1>Aktion hinzufügen</h1>

    {% if messages %}
        {% for message in messages %}
            <p class="{{ message.level_tag }}-message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <button class="info-btn" id="anmerkung-button" onclick="toggleAnmerkung()" style="display: none;" type="button">?
    </button>
    <div id="anmerkung-box" class="anmerkung-box" style="display: none;"></div>

    <form method="POST">
        {% csrf_token %}
        <label for="action_type" class="action-label">Aktionstyp:</label>
        <select name="action_type" class="action-label" id="action_type" required>
            <option value="" disabled selected>Aktionstyp auswählen ▾</option>
            {% for aktion in aktionen %}
                <option value="{{ aktion.name }}" data-klimapunkte="{{ aktion.klimapunkte|floatformat:-4 }}" data-anmerkung="{{ aktion.anmerkung|safe }}" data-mengebeschreibung="{{ aktion.mengeBeschreibung }}" data-aktiondate="{{ aktion.date }}">{{ aktion.name }}</option>
            {% endfor %}
        </select>
        <br/>

        <p id="klimapunkte_anzeige" class="action-label"></p>

        <label for="action_description" class="action-label">Beschreibung:</label>
        <input type="text" id="action_description" name="action_description" placeholder="Optional"/>
        <br/>

        <label for="action_quantity" class="action-label" id="action_quantity_label">Menge:</label>
        <input type="number" id="action_quantity" name="action_quantity" min="0" required/>
        <br/>

        <p id="impact_anzeige" class="action-label"></p>

        <label for="action_date" class="action-label">Datum:</label>
        <input type="date" id="action_date" name="action_date" required/>
        <br/>

        <label class="custom-checkbox">
            <input type="checkbox" name="is_truth">
            <span class="checkmark"></span>
            <span class="label-text">Ich bestätige, dass alle Angaben der Wahrheit entsprechen und mit den <a href="{% url 'nutzungsbedingungen' %}">Nutzungsbedingungen</a> übereinstimmen.</span>
        </label>

        <button type="submit">Hinzufügen</button>
    </form>

    <script>
        document.getElementById('action_type').addEventListener('change', function () {
            const selected = document.querySelector('#action_type').selectedOptions[0]

            const anmerkungBox = document.getElementById('anmerkung-box')
            const anmerkungButton = document.getElementById('anmerkung-button')

            const klimapunkte_anzeige = document.getElementById('klimapunkte_anzeige')
            const action_quantity_label = document.getElementById('action_quantity_label');

            let anmerkung = selected.dataset.anmerkung
            let klimapunkte = selected.dataset.klimapunkte
            let mengeBeschreibung = selected.dataset.mengebeschreibung;


            action_quantity_label.textContent = mengeBeschreibung
            klimapunkte_anzeige.textContent = 'Klimapunkte pro ' + mengeBeschreibung + ': ' + klimapunkte
            calculateImpact()

            if (anmerkung != '') {
                anmerkungButton.style.display = 'inline-block'
                anmerkungBox.textContent = anmerkung
            } else {
                anmerkungButton.style.display = 'none'
                anmerkungBox.textContent = ''
                anmerkungBox.style.display = 'none'
            }
        })

        document.getElementById('action_quantity').addEventListener('input', calculateImpact)

        function calculateImpact() {
            const selected = document.querySelector('#action_type').selectedOptions[0]
            const impact_anzeige = document.getElementById('impact_anzeige')
            let klimapunkte = selected.dataset.klimapunkte
            klimapunkte = parseFloat(klimapunkte)
            let quantity = document.getElementById('action_quantity').value
            quantity = parseFloat(quantity)

            let impact = klimapunkte * quantity

            if (isNaN(impact)) {
                impact_anzeige.textContent = ''
            } else {
                impact_anzeige.textContent = 'Insgesamt durch diese Aktion gewonnene Klimapunkte: ' + impact
            }
        }

        function toggleAnmerkung() {
            const box = document.getElementById('anmerkung-box')
            box.style.display = box.style.display === 'none' ? 'block' : 'none'
        }
    </script>
{% endblock %}
