<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Bottom-Bar an den unteren Rand fixieren */
        .tabbar {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;

            display: flex;
            justify-content: space-around;
            border-top: 1px solid #ddd;

            background: #c3c3c3;
            height: 60px; /* ähnlich iOS-Höhe */
        }

        /* Jeder Tab */
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: #444;
            font-size: 11px; /* typische TabBar-Schrift */
        }

        /* Aktiver Tab */
        .tab-item.active {
            color: #007aff; /* iOS Blau */
        }

        /* Icon oben */
        .tab-icon {
            font-size: 22px;
            line-height: 1;
        }

        /* Label darunter, mit Abschneiden */
        .tab-label {
            max-width: 80%; /* oder feste Breite z.B. 70px */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            margin-top: 2px;
        }

    </style>
</head>
<body>
<nav class="tabbar">
    <a href="#" id="home" class="tab-item">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Home</span>
    </a>
    <a href="#" id="search" class="tab-item">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Suche</span>
    </a>
    <a href="#" id="star" class="tab-item">
        <span class="tab-icon">⭐</span>
        <span class="tab-label">Sehr langer Text der abgeschnitten wird</span>
    </a>
    <a href="#" id="settings" class="tab-item">
        <span class="tab-icon">⚙️</span>
        <span class="tab-label">Einstellungen</span>
    </a>
</nav>
<script>let currentPage = "search";</script>
<script>
    let currentTab = document.querySelector('.tabbar').querySelector(`#${currentPage}`);
    currentTab.classList.add('active');
</script>
</body>
</html>
