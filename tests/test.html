<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<style>
    .div {
        height: 100vh; /* oder eine feste Höhe */
        display: flex;
        justify-content: center;
        align-items: center;
    }


    .btn {
        height: 100px;
        width: 100px;
        color: white;
        background-color: goldenrod;
        display: flex;
        justify-content: center;
        justify-self: center;
        align-items: center;
        border: none;
        border-radius: 5%;
        animation: rotate 2s infinite;
    }

    @keyframes rotate {
        0% {

        }
        25% {
            height: 125px;
            width: 125px;
        }
        50% {
            border-radius: 50%;
            display: none;
            height: 100px;
            width: 100px;
        }
        75% {
            height: 125px;
            width: 125px;
        }
        100% {

        }
    }
</style>
<div class="div">
    <div class="btn">Test</div>
</div>
</body>
