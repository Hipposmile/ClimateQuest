<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ladebalken</title>
    <style></style>
</head>
<body>
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ab accusantium deleniti exercitationem, harum hic illo inventore labore laudantium maxime modi quas quasi quod repellat, repellendus reprehenderit sequi voluptas voluptates! Quo.</p>
<img src="../static/images/refresh/refresh-fallback.png">
<img src="../static/images/candle/candle-fallback.png">


<div id="loader">
    <div id="bar"></div>
</div>

<script>
    const bar = document.getElementById('bar');
    document.addEventListener("DOMContentLoaded", () => {
        bar.style.width = "50%";
    });
    window.addEventListener("load", () => {
        bar.style.width = "100%";
    });
</script>

<style>
    #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 400px;
        background: #ddd;
    }

    #bar {
        height: 100%;
        width: 0%;
        background: #4a90e2;
        transition: width .2s ease;
    }
</style>
</body>
</html>
