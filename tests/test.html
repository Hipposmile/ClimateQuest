<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Scroll-Effekt</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 200vh; /* genug Platz zum Scrollen */
      font-family: sans-serif;
    }

    .hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: url('IMG_2713.HEIC') center/cover no-repeat;
      transition: opacity 1s ease;
      z-index: -1;
    }

    .text-section {
      margin-top: 120vh;
      padding: 50px;
      font-size: 2em;
      opacity: 0;
      transition: opacity 1s ease;
      color: white;
    }

    .text-visible {
      opacity: 1;
    }

    .hero.fade-out {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="hero" id="hero"></div>

  <div class="text-section" id="text">
    Willkommen bei Climate Quest! 🌱<br>
    Gemeinsam gestalten wir die Zukunft.
  </div>

  <script>
    const hero = document.getElementById('hero');
    const text = document.getElementById('text');

    window.addEventListener('scroll', () => {
      const textTop = text.getBoundingClientRect().top;
      const windowHeight = window.innerHeight;

      if (textTop < windowHeight) {
        text.classList.add('text-visible');
        hero.classList.add('fade-out');
      } else {
        text.classList.remove('text-visible');
        hero.classList.remove('fade-out');
      }
    });
  </script>

</body>
</html>
